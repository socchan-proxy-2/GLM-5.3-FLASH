build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"
  system_packages:
    - "git"
    - "cmake"
    - "ninja-build"
    - "clang"
    - "mold"
    - "build-essential"
    - "pciutils"
    - "curl"
    - "libcurl4-openssl-dev"
  python_packages:
    - "huggingface_hub[cli]"
    - "requests"
  run:
    # Unsloth's glm5next-support fork of llama.cpp — mainline has no glm5_next
    # architecture support yet (as of 2026-08-26, PRs #27752/#27754 unmerged).
    # NOTE: the model weights (~120GB, UD-IQ3_XXS) are deliberately NOT
    # downloaded here at build time — they're pulled inside setup() instead,
    # so the local `cog build`/`cog push` on your machine stays lightweight
    # (just the llama.cpp compile, no 120GB disk requirement locally).
    # Tradeoff: every cold start on Replicate re-downloads ~120GB, adding
    # several minutes to cold boot. This download time should fall under
    # Replicate's free "setup" phase for public models (not billed), but
    # confirm this in your dashboard after a real run.
    - "git clone --branch glm5next/upstream https://github.com/unslothai/llama.cpp /src/llama.cpp"
    # Building for every CUDA arch (Ampere/Hopper/Blackwell/etc) at once is
    # what blows up disk usage during compilation — each arch gets its own
    # copy of every kernel. Restrict to A100 only (sm_80).
    # Also: Ninja (not Make) for faster/leaner parallel builds, and mold
    # (not GNU ld) for much faster, lower-overhead linking of the large
    # CUDA object files.
    - >
      cmake /src/llama.cpp -B /src/llama.cpp/build -G Ninja
      -DBUILD_SHARED_LIBS=OFF -DGGML_CUDA=ON
      -DCMAKE_CUDA_ARCHITECTURES=80
      -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=mold"
      -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=mold"
    - >
      cmake --build /src/llama.cpp/build --config Release
      --target llama-cli llama-mtmd-cli llama-server llama-gguf-split
    - "mkdir -p /src/bin && cp /src/llama.cpp/build/bin/llama-* /src/bin/"
    # Free the intermediate object files / CUDA fatbins now that the
    # binaries are built and copied out - these are what ate the disk.
    - "rm -rf /src/llama.cpp/build/CMakeFiles /src/llama.cpp/.git"

predict: "predict.py:Predictor"

