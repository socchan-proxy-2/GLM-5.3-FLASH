build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"
  # NOTE ON COLD START TIMEOUT:
  # Baking the model into the image (vs downloading in setup()) means cold
  # start no longer depends on a fresh ~93GB download, just image pull +
  # load. Still, loading ~93GB of weights from disk into GPU/CPU memory
  # is not instant - if you see "RemoteProtocolError: peer closed
  # connection ... setup failed" again, it may still be Replicate/Cog's
  # default 10-minute setup() timeout. COG_SETUP_TIMEOUT is a RUNTIME env
  # var (not settable in cog.yaml) - set it in the Replicate dashboard
  # under deployment environment variables if needed, e.g. 10800 (3 hours).
  system_packages:
    - "curl"
    - "pciutils"
  python_packages:
    - "huggingface_hub==0.25.2"
    - "hf_transfer==0.1.8"
  run:
    # Use Unsloth's prebuilt llama.cpp binaries instead of compiling from
    # source - this specific release (b10715-mix-86bd2d3) has GLM-5-Next
    # (GLM-5.3-Flash) support merged in (ggml-org#27754), so no more ~20min
    # from-scratch CUDA compile.
    # "cuda12-older" variant covers sm 70-89, which includes A100 (sm_80).
    # See: https://github.com/unslothai/llama.cpp/releases/tag/b10715-mix-86bd2d3
    - >
      mkdir -p /src/bin &&
      curl -sL
      https://github.com/unslothai/llama.cpp/releases/download/b10715-mix-86bd2d3/app-b10715-mix-86bd2d3-linux-x64-cuda12-older.tar.gz
      | tar -xz -C /src/bin
    - "chmod +x /src/bin/llama-server /src/bin/llama-cli"
    # Bake the 1-bit dynamic quant (UD-IQ1_M) into the image itself.
    # NOTE: the originally-referenced "UD-TQ1_0" filename does not exist in
    # this repo - actual available 1-bit tier is UD-IQ1_M (S/M size variants
    # present under the repo tree). Confirm exact size/accuracy tradeoff
    # against the model card before relying on these numbers.
    # ALSO NOTE: field reports on the upstream PR (ggml-org#27752) say
    # UD-IQ1_M produced repeated-token garbage on this architecture during
    # testing - the 1-bit tier may simply not work well for glm5next
    # regardless of variant. Watch output quality closely and be ready to
    # fall back to 3-bit (UD-IQ3_XXS, ~120GB) if so.
    # IMPORTANT: allow_patterns=['*UD-IQ1_M*'] is too broad - it also matches
    # a stray duplicate shard under a "Shard_Rewrite/" directory in this
    # repo (confirmed via `hf repo files`), which caused the first-shard
    # detection to potentially pick the wrong (possibly incomplete/patch)
    # copy, leading to a hang with no clear error at load time.
    # Anchor the pattern to the actual "UD-IQ1_M/" directory only.
    - >
      HF_HUB_ENABLE_HF_TRANSFER=1 python3 -c "from huggingface_hub import snapshot_download;
      snapshot_download(repo_id='unsloth/GLM-5.3-Flash-GGUF',
      local_dir='/src/model', allow_patterns=['UD-IQ1_M/*'])"

predict: "predict.py:Predictor"
